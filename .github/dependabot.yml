version: 2
updates:
  # Gradle (main plugin) — split majors to isolate IntelliJ Platform breaking changes
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # CodeQL's Kotlin extractor lags Kotlin releases (2.26.x supports <= 2.4.0);
      # newer Kotlin fails the java-kotlin code-scanning job with
      # KotlinVersionTooRecentError. Remove when CodeQL supports Kotlin 2.4.10+.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [ "[2.4.1,)" ]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [ "[2.4.1,)" ]
    groups:
      gradle-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      gradle-major:
        patterns: [ "*" ]
        update-types: [ "major" ]

  # GitHub Actions — bundle everything (low blast radius, safe to group majors)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: [ "*" ]